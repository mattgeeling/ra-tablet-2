<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R&amp;A Interactive Preview</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.96), rgba(235, 238, 245, 0.92) 55%, rgba(222, 226, 236, 0.9)),
          #eef1f7;
        font-family: Montserrat, Avenir, "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .preview-shell {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 28px;
      }

      .debug-label {
        position: absolute;
        top: -10px;
        right: -10px;
        margin: 0;
        padding: 10px 14px;
        border-radius: 999px;
        background: #d73a31;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        box-shadow: 0 12px 24px rgba(108, 18, 14, 0.24);
      }

      .preview-label {
        margin: 0;
        color: #5b637f;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tablet-frame {
        padding: 30px;
        border-radius: 42px;
        background: #000;
        box-shadow:
          0 28px 56px rgba(19, 26, 52, 0.16),
          0 8px 18px rgba(19, 26, 52, 0.1);
      }

      .tablet-stage {
        display: block;
        width: 1080px;
        height: 810px;
        border: 0;
        border-radius: 24px;
        background: #191e42;
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <p class="debug-label">Debug</p>
      <p class="preview-label">Client Preview • Fixed 1080 × 810</p>
      <div class="tablet-frame">
        <iframe class="tablet-stage" src="./index.html" title="R&amp;A tablet preview"></iframe>
      </div>
    </main>
  </body>
</html>
